name: Backend quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Temiz GitHub runner'ında yerel Maven önbelleği bulunmadığı için -o kullanılamaz.
      - name: Compile, test and enforce coverage
        run: mvn -B verify "-Dtest=*Test"
