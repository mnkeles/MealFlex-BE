name: Backend security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate deployment shell scripts
        run: shellcheck deploy/*.sh
      - name: Validate staging Compose model
        env:
          DB_NAME: mealflex_ci
          DB_USERNAME: mealflex_ci
          DB_PASSWORD: ci
          APP_VERSION: ci
          PUBLIC_HOST: staging.example.test
          PUBLIC_BASE_URL: https://staging.example.test
          TLS_EMAIL: ops@example.test
          JWT_SECRET: ci
          PAYMENT_WEBHOOK_SECRET: ci
        run: docker compose -f deploy/docker-compose.staging.yml config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e PUBLIC_HOST=staging.example.test
          -e TLS_EMAIL=ops@example.test
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine validate --config /etc/caddy/Caddyfile
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
