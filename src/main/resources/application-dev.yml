spring:
  config:
    # Yerel `.env` dosyası Git'e eklenmez; geliştirici makinesindeki bağlantı
    # bilgilerini güvenle sağlar. Dosya yoksa ortam değişkenleri kullanılmaya devam eder.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mealflex}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.mealflex: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:mealflex-dev-secret-key-change-in-production-minimum-256-bits-long-key}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:mealflex-local-webhook-secret}
  verification:
    expose-code: true
