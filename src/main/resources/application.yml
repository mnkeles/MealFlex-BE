spring:
  application:
    name: mealflex-api

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  data:
    web:
      pageable:
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 9090
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:mealflex-dev-secret-key-change-in-production-minimum-256-bits-long-key}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
  payment:
    provider: MOCK
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:mealflex-local-webhook-secret}
    iyzico:
      api-key: ${IYZICO_API_KEY:}
      secret-key: ${IYZICO_SECRET_KEY:}
      base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
      callback-url: ${IYZICO_CALLBACK_URL:http://localhost:5173/payments/iyzico-callback}
    currency: TRY
    collection-model: FULL_ON_SELLER_APPROVAL
  invoice:
    elogo:
      enabled: ${ELOGO_ENABLED:false}
      base-url: ${ELOGO_BASE_URL:}
      client-id: ${ELOGO_CLIENT_ID:}
      client-secret: ${ELOGO_CLIENT_SECRET:}
      sender-alias: ${ELOGO_SENDER_ALIAS:}
