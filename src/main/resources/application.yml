spring:
  application:
    name: mealflex-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  data:
    web:
      pageable:
        max-page-size: 100

  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 9090
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  location:
    distance-engine: ${LOCATION_DISTANCE_ENGINE:HAVERSINE}
    shadow-tolerance-meters: ${LOCATION_SHADOW_TOLERANCE_METERS:100}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  notifications:
    external-enabled: ${NOTIFICATION_EXTERNAL_ENABLED:false}
    dispatch-delay-ms: ${NOTIFICATION_DISPATCH_DELAY_MS:30000}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    email:
      endpoint: ${NOTIFICATION_EMAIL_ENDPOINT:}
      api-key: ${NOTIFICATION_EMAIL_API_KEY:}
    sms:
      endpoint: ${NOTIFICATION_SMS_ENDPOINT:}
      api-key: ${NOTIFICATION_SMS_API_KEY:}
    push:
      endpoint: ${NOTIFICATION_PUSH_ENDPOINT:}
      api-key: ${NOTIFICATION_PUSH_API_KEY:}
  jwt:
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  payment:
    provider: ${PAYMENT_PROVIDER:MOCK}
    iyzico:
      api-key: ${IYZICO_API_KEY:}
      secret-key: ${IYZICO_SECRET_KEY:}
      base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
      callback-url: ${IYZICO_CALLBACK_URL:}
      card-management-callback-url: ${IYZICO_CARD_MANAGEMENT_CALLBACK_URL:}
    currency: TRY
    collection-model: WEEKLY
    payment-completion-hours: ${PAYMENT_COMPLETION_HOURS:24}
  payout:
    provider: ${PAYOUT_PROVIDER:MOCK}
  invoice:
    elogo:
      enabled: ${ELOGO_ENABLED:false}
      base-url: ${ELOGO_BASE_URL:}
      client-id: ${ELOGO_CLIENT_ID:}
      client-secret: ${ELOGO_CLIENT_SECRET:}
      sender-alias: ${ELOGO_SENDER_ALIAS:}
